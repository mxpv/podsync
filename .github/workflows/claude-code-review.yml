name: Claude Code

on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review, reopened]

# Cancel superseded reviews when a pull request branch is pushed again.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Skip dependabot PRs - they're dependency bumps that don't need code review
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read

    steps:
      - name: Checkout base repository
        uses: actions/checkout@v6
        with:
          # Full history so the review can read git blame and past changes.
          fetch-depth: 0
          # The review never pushes, so don't leave a token in .git/config.
          persist-credentials: false

      - name: Review
        id: claude-review
        uses: anthropics/claude-code-action@v1.0.206
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Fork contributors don't have write access, so the action would stop
          # before running Claude. allowed_non_write_users requires github_token.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_non_write_users: "*"
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment"
          # This job reads untrusted pull request content while repository
          # credentials are present, so Bash is restricted to the specific
          # read-only commands the review needs rather than a full shell.
          claude_args: |
            --allowedTools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(git log:*),Bash(git blame:*),Bash(git show:*),Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment"
