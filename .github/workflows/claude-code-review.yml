name: Claude Code

on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    # Skip dependabot PRs - they're dependency bumps that don't need code review
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout base repository
        uses: actions/checkout@v6
        with:
          # Full history so the review can read git blame and past changes.
          fetch-depth: 0

      - name: Review
        id: claude-review
        uses: anthropics/claude-code-action@v1.0.193
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Fork contributors don't have write access, so the action would stop
          # before running Claude. allowed_non_write_users requires github_token.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_non_write_users: "*"
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: |
            --allowedTools "Bash,Read,Glob,Grep"
